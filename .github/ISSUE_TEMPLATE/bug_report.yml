name: Bug report / 问题反馈
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, private clipboard content or personal screenshots. For security issues, read SECURITY.md first.
  - type: input
    id: environment
    attributes:
      label: macOS / Magpie commit or version / Intel or Apple silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic sample / 复现步骤与示例
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant permissions, logs and test results / 权限与验证结果
      description: Redact private data. State whether this is a source build or a signed release.
