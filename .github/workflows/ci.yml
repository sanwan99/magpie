name: macOS CI
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Toolchain
        run: xcodebuild -version
      - name: Tooling regression tests
        run: python3 -m unittest discover -s Tests/Tooling -v
      - name: Privacy log and documentation checks
        run: |
          python3 Scripts/check-privacy-logs.py
          python3 Scripts/check-doc-links.py
      - name: Release configuration build
        run: Scripts/build-local.sh
      - name: All XCTest tests
        env:
          MAGPIE_TEST_RESULT_PATH: ${{ runner.temp }}/Magpie.xcresult
        run: Scripts/test.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: ${{ runner.temp }}/Magpie.xcresult
          if-no-files-found: warn
